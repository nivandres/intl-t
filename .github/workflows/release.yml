name: Release
# Publishes every package at the version in the root package.json, then tags and releases it.
# Run it from the Actions tab (or the API) on main after bumping the versions.
#
# npm auth: trusted publishing (OIDC) when the packages trust this workflow on npmjs.com,
# otherwise the NPM_TOKEN secret. Deprecating needs NPM_TOKEN.
on:
  workflow_dispatch:
    inputs:
      deprecate:
        description: Older versions to deprecate on npm after publishing (space separated, empty to skip)
        required: false
        default: ""
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/main.yml
  release:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@^11.5.1
      - name: Install deps
        run: bun install
      - name: Build
        run: bun run build
      - name: Pack and verify tarballs
        run: bun scripts/release.ts pack
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/release.ts publish
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          notes=".github/release-notes/$tag.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" --generate-notes
          fi
      - name: Deprecate older versions
        if: inputs.deprecate != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSIONS: ${{ inputs.deprecate }}
        run: bun scripts/release.ts deprecate $VERSIONS
